<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Chocolate</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      rel="stylesheet"
      href="./css/styles.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <nav class="header-navigation">
          <a
            class="header-logo"
            href="./index.html"
            ><span class="header-logo-italic">SIMPLY</span> CHOCOLATE</a
          >
          <ul class="header-list">
            <li class="header-item">
              <a
                class="header-link"
                href="./index.html"
                >Home</a
              >
            </li>
            <li class="header-item">
              <a
                class="header-link"
                href="#made"
                >How it’s made?</a
              >
            </li>
            <li class="header-item">
              <a
                class="header-link"
                href=""
                >Chocolate is loved</a
              >
            </li>
          </ul>
        </nav>
        <ul class="header-soc-list">
          <li class="header-soc-item">
            <a
              class="header-soc-link"
              href="./index.html"
              ><svg
                class="header-soc-icon"
                width="24"
                height="24"
              >
                <use href="./img/icons.svg#icon-instagram"></use></svg
            ></a>
          </li>
          <li class="header-soc-item">
            <a
              class="header-soc-link"
              href="#made"
              ><svg
                class="header-soc-icon"
                width="24"
                height="24"
              >
                <use href="./img/icons.svg#twitter"></use></svg
            ></a>
          </li>
        </ul>
      </div>
    </header>

    <footer class="footer">
      <div class="container">
        <p class="footer-text">
          <span class="accent">Chocolate</span> a delicious cure for a bad day
        </p>
        <p class="footer-contacts-title">Contact us</p>
        <address class="footer-contacts">
          <ul class="footer-contacts-list">
            <li class="footer-contacts-item">
              <a
                class="footer-contacts-link"
                href="tel:+380684439426"
                >+380 (68) 443-94-26</a
              >
            </li>
            <li class="footer-contacts-item">
              <a
                class="footer-contacts-link"
                href="mailto:simplycthаoc@gmail.com"
                >simplycthаoc@gmail.com</a
              >
            </li>
          </ul>
        </address>
        <ul class="footer-menu-list">
          <li class="footer-menu-item">
            <a
              class="footer-menu-link"
              href="./index.html"
              >Home</a
            >
          </li>
          <li class="footer-menu-item">
            <a
              class="footer-menu-link"
              href=""
              >How it’s made?</a
            >
          </li>
          <li class="footer-menu-item">
            <a
              class="footer-menu-link"
              href=""
              >Chocolate is loved</a
            >
          </li>
        </ul>
      </div>
    </footer>
    <div class="backdrop">
      <div class="modal">
        <button
          type="button"
          class="modal-close-button"
        >
          X
        </button>
        <p class="modal-title section-title">
          LEAVE A REVIEW ABOUT <span class="accent">OUR CHOCOLATE</span>
        </p>
        <form class="modal-form">
          <div class="modal-field">
            <label
              for="user-name"
              class="modal-label"
              >Name</label
            >
            <div class="modal-field-wrapper">
              <input
                type="text"
                class="modal-input"
                placeholder="Enter your data"
                name="user-name"
                required
                minlength="3"
                id="user-name"
              />
              <svg
                class="modal-field-icon"
                width="24"
                height="24"
              >
                <use href="./img/icons.svg#icon-user"></use>
              </svg>
            </div>
          </div>
          <div class="modal-field">
            <label
              for="user-email"
              class="modal-label"
              >Email</label
            >
            <div class="modal-field-wrapper">
              <input
                type="email"
                class="modal-input"
                placeholder="Enter your data"
                name="user-email"
                id="user-email"
              />
              <svg
                class="modal-field-icon"
                width="24"
                height="24"
              >
                <use href="./img/icons.svg#icon-user"></use>
              </svg>
            </div>
          </div>
          <div class="modal-field">
            <label
              for="user-phone"
              class="modal-label"
              >Phone</label
            >
            <input
              type="tel"
              class="modal-input"
              placeholder="Enter your data"
              name="user-phone"
              id="user-phone"
              required
            />
          </div>
          <div class="modal-field">
            <label
              for="user-comment"
              class="modal-label"
              >Comment</label
            >
            <textarea
              class="modal-input modal-textarea"
              placeholder="Enter your comment"
              name="user-comment"
              id="user-comment"
              required
            ></textarea>
          </div>
          <button
            type="submit"
            class="modal-button"
          >
            Submit
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
